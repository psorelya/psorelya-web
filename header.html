<script>
(function trySetLang() {
    var map = {
        'index.html': 'en/index.html',
        'notre-histoire.html': 'en/our-story.html',
        'article-vitamine-d3.html': 'en/article-vitamin-d3.html',
        'mentions-legales.html': 'en/legal.html'
    };
    var page = window.location.pathname.split('/').pop();
    if (!page) page = 'index.html';
    var enPage = map[page] || 'en/index.html';
    var link = document.getElementById('lang-en-link');
    if (link) { link.href = enPage; }
    else { setTimeout(trySetLang, 50); }
})();
window.setLangLink = function() {
    var map = {
        'index.html': 'en/index.html',
        'notre-histoire.html': 'en/our-story.html',
        'article-vitamine-d3.html': 'en/article-vitamin-d3.html',
        'mentions-legales.html': 'en/legal.html'
    };
    var page = window.location.pathname.split('/').pop();
    if (!page) page = 'index.html';
    var enPage = map[page] || 'en/index.html';
    var link = document.getElementById('lang-en-link');
    if (link) link.href = enPage;
};

function toggleMenu() {
    document.getElementById('mon-menu').classList.toggle('show');
}

// Fermer en cliquant ailleurs
document.addEventListener('click', function(e) {
    var menu = document.getElementById('mon-menu');
    var btn = document.getElementById('menu-btn');
    if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove('show');
    }
});

// Fermer au scroll
window.addEventListener('scroll', function() {
    var menu = document.getElementById('mon-menu');
    if (menu) menu.classList.remove('show');
}, { passive: true });

// Compteur panier WooCommerce via cookie
function getCartCount() {
    var cookies = document.cookie.split(';');
    for (var i = 0; i < cookies.length; i++) {
        var c = cookies[i].trim();
        if (c.indexOf('woocommerce_items_in_cart=') === 0) {
            return parseInt(c.substring('woocommerce_items_in_cart='.length)) || 0;
        }
    }
    return 0;
}
function updateCartBadge() {
    var count = getCartCount();
    var badge = document.getElementById('cart-count');
    if (badge) {
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
    }
}
updateCartBadge();
setInterval(updateCartBadge, 2000);
</script>
